robot:
  type: so101_follower
  port: COM7
  cameras: 
    front: 
      type: opencv
      index_or_path: 0
      width: 640
      height: 480
      fps: 30

    head: 
      type: opencv
      index_or_path: 1
      width: 640
      height: 480
      fps: 30

    side: 
      type: opencv
      index_or_path: 2
      width: 640
      height: 480
      fps: 30

dataset: 
  repo_id: kourindayo/eval_temp
  single_task: "Grap the si_ball"
  push_to_hub: false
  episode_time_s: 600
  reset_time_s: 0
  num_episodes: 1

display_data: false